<!DOCTYPE html>

    <title>Supporting Material</title>
</head>
<body>

   <form id="requestForm" method="get" >
        <label for="fileType">Choose a type:</label>
        <select id="fileType" name="fileType" required>
            <option value="image">Image</option>
            <option value="video">Video</option>
        </select>
        <br><br>
        <label for="fileName">File/Topic Name:</label>
        <input type="text" id="fileName" name="fileName" placeholder="Enter file or topic name" required>
        <br><br>
        <button type="submit">Request</button>
    </form>




</body>
</html>
